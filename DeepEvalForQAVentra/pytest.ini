[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v -s --tb=short

markers =
    quality: RAG quality metrics (relevancy, faithfulness, retrieval)
    safety: safety metrics (hallucination, toxicity, bias, PII)
    custom: custom G-Eval metrics specific to the QA domain
    retrieval: metrics that specifically grade the retrieval step
    generation: metrics that specifically grade the generation step
    slow: metrics that take noticeably longer to run